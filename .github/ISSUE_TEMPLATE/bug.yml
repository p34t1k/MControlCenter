name: Bug
description: Something is broken
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: report
    attributes: { label: Output of mcenter-doctor report, render: markdown }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Log (run `MCC_FRAMELOG=1 mcenter` from a terminal if it is a UI/performance problem), render: shell }
