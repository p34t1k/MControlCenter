name: Hardware report (my MSI model)
description: Tell us how Mcenter behaves on your laptop - this is how we widen device support.
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Run `/usr/libexec/mcenter/mcenter-doctor report` (or `scripts/mcenter-doctor report` from the repo) and paste the output below. It contains no serial numbers or personal data.
  - type: textarea
    id: report
    attributes: { label: Output of mcenter-doctor report, render: markdown }
    validations: { required: true }
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Dashboard shows CPU temperature and fan speed
        - label: GPU temperature / second fan (if my laptop has one)
        - label: Switching power modes
        - label: Cooler Boost
        - label: Battery charge limit
        - label: Power & Battery integration with my desktop
  - type: textarea
    id: notes
    attributes: { label: What is missing, wrong or odd? Screenshot welcome. }
